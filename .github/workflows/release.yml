name: Release

on:
  push:
    tags: ['v*']

jobs:
  docker-self-host:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ./apps/self-host/docker/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository }}/prdgenz-self-host:latest
            ghcr.io/${{ github.repository }}/prdgenz-self-host:${{ github.ref_name }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
