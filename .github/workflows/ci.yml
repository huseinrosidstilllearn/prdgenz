name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.10.0

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma clients
        run: |
          pnpm --filter @prdgenz/cloud exec prisma generate
          pnpm --filter @prdgenz/self-host exec prisma generate

      - name: Build
        run: pnpm run build

      - name: Typecheck
        run: pnpm run typecheck

      - name: Test
        run: pnpm test

  docker:
    # Validate the self-host Dockerfile builds on every push/PR (no push).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build self-host image (dry run)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./apps/self-host/docker/Dockerfile
          push: false
          tags: prdgenz-self-host:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
