name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.10.0

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma clients
        run: |
          pnpm --filter @prdgenz/cloud exec prisma generate
          pnpm --filter @prdgenz/self-host exec prisma generate

      - name: Build
        run: pnpm run build

      - name: Typecheck
        run: pnpm run typecheck

      - name: Lint
        run: pnpm lint

      - name: Test (with enforced coverage thresholds)
        run: pnpm test:coverage

  e2e:
    # Playwright smoke E2E for the cloud app against a throwaway Postgres.
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: prdgenz_e2e
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      E2E_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/prdgenz_e2e?schema=public
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.10.0

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma clients
        run: |
          pnpm --filter @prdgenz/cloud exec prisma generate
          pnpm --filter @prdgenz/self-host exec prisma generate

      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium

      - name: Run E2E
        run: pnpm e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: apps/cloud/playwright-report/
          retention-days: 7

  docker:
    # Validate the self-host Dockerfile builds on every push/PR (no push).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Resolve and validate Compose build paths
        id: compose
        run: |
          docker compose -f apps/self-host/docker/docker-compose.yml config --format json > "$RUNNER_TEMP/prdgenz-compose.json"
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          config = json.loads((Path(os.environ['RUNNER_TEMP']) / 'prdgenz-compose.json').read_text())
          build = config['services']['prdgenz']['build']
          context = Path(build['context']).resolve()
          dockerfile = (context / build['dockerfile']).resolve()
          if not dockerfile.is_file():
              raise SystemExit(f'Compose Dockerfile does not exist: {dockerfile}')
          if not (context / 'pnpm-workspace.yaml').is_file():
              raise SystemExit(f'Compose build context is not the monorepo root: {context}')
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write(f'context={context}\ndockerfile={dockerfile}\n')
          PY

      - name: Build self-host image (dry run)
        uses: docker/build-push-action@v6
        with:
          context: ${{ steps.compose.outputs.context }}
          file: ${{ steps.compose.outputs.dockerfile }}
          push: false
          load: true
          tags: prdgenz-self-host:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test Compose startup and SQLite persistence
        timeout-minutes: 4
        run: |
          docker compose -f apps/self-host/docker/docker-compose.yml up -d --no-build
          python3 scripts/self-host-smoke.py create "$RUNNER_TEMP/prdgenz-self-host-smoke.json"
          docker compose -f apps/self-host/docker/docker-compose.yml down
          docker compose -f apps/self-host/docker/docker-compose.yml up -d --no-build
          python3 scripts/self-host-smoke.py verify "$RUNNER_TEMP/prdgenz-self-host-smoke.json"

      - name: Container logs on failure
        if: failure()
        run: docker compose -f apps/self-host/docker/docker-compose.yml logs --no-color

      - name: Clean up smoke test containers and volumes
        if: always()
        run: docker compose -f apps/self-host/docker/docker-compose.yml down --volumes
