# PRD GenZ — self-hosted via Docker Compose (PRD §8.5.2)
# Usage:
#   1. cp .env.example .env  (fill in at least one *_API_KEY)
#   2. docker compose up -d
#   3. open http://localhost:3000

services:
  prdgenz:
    build:
      context: ../..
      dockerfile: apps/self-host/docker/Dockerfile
    image: prdgenz-self-host:latest
    container_name: prdgenz-self-host
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: "file:/data/prdgenz.db"
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      GOOGLE_API_KEY: ${GOOGLE_API_KEY:-}
      OMNIROUTE_API_KEY: ${OMNIROUTE_API_KEY:-}
      TOKENROUTER_API_KEY: ${TOKENROUTER_API_KEY:-}
      9ROUTER_API_KEY: ${9ROUTER_API_KEY:-}
      CUSTOM_API_KEY: ${CUSTOM_API_KEY:-}
      CUSTOM_BASE_URL: ${CUSTOM_BASE_URL:-}
      AI_DEFAULT_PROVIDER: ${AI_DEFAULT_PROVIDER:-openai}
      AI_DEFAULT_MODEL: ${AI_DEFAULT_MODEL:-}
      AI_DEFAULT_LANGUAGE: ${AI_DEFAULT_LANGUAGE:-EN}
    volumes:
      - prdgenz-data:/data

volumes:
  prdgenz-data:
